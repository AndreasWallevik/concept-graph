<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="990" viewBox="0 0 1500 990" role="img" aria-labelledby="title desc">
  <title id="title">Dagens Concept Graph og foreslått dataflyt fra UniMicro V3</title>
  <desc id="desc">Øvre panel viser dagens Flask-app og statiske demo. Nedre panel viser en planlagt intern synkroniseringsjobb som leser et avgrenset produktuttrekk fra UniMicro V3, validerer det og publiserer kun en godkjent JSON-fil til en statisk visning.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="proposal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087e75"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #183047; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #526579; }
      .section { font-size: 22px; font-weight: 700; }
      .zone { font-size: 16px; font-weight: 700; }
      .box-title { font-size: 16px; font-weight: 700; text-anchor: middle; }
      .box-note { font-size: 12px; fill: #526579; text-anchor: middle; }
      .annotation { font-size: 13px; fill: #526579; }
      .current { fill: #edf3fa; stroke: #8aa6c4; stroke-width: 2; }
      .current-data { fill: #fff7e8; stroke: #d6aa5c; stroke-width: 2; }
      .proposed { fill: #e7f7f3; stroke: #47a798; stroke-width: 2; }
      .control { fill: #e9efff; stroke: #7190d1; stroke-width: 2; }
      .published { fill: #fff7e8; stroke: #d6aa5c; stroke-width: 2; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .future-line { fill: none; stroke: #087e75; stroke-width: 3; marker-end: url(#proposal-arrow); }
      .dashed { stroke-dasharray: 7 5; }
    </style>
  </defs>

  <rect width="1500" height="990" fill="#f8fafc"/>
  <text x="48" y="54" class="title">Concept Graph: nåværende app og foreslått UniMicro-flyt</text>
  <text x="48" y="80" class="subtitle">Oversikt på komponentnivå · grønt er forslag, blått og gult finnes i dag · piler viser hovedflyt</text>

  <rect x="40" y="105" width="1420" height="345" rx="18" fill="#ffffff" stroke="#ccd7e2" stroke-width="2"/>
  <text x="65" y="140" class="section">I dag</text>
  <text x="65" y="163" class="annotation">Lokal, redigerbar Flask-app og separat statisk Autic-demo</text>

  <rect x="65" y="195" width="185" height="76" rx="10" class="current"/>
  <text x="157" y="226" class="box-title">Nettleser</text>
  <text x="157" y="248" class="box-note">Cytoscape fra CDN</text>
  <rect x="300" y="195" width="195" height="76" rx="10" class="current"/>
  <text x="397" y="226" class="box-title">HTML + app.js</text>
  <text x="397" y="248" class="box-note">søk, graf og redigering</text>
  <rect x="545" y="195" width="195" height="76" rx="10" class="current"/>
  <text x="642" y="226" class="box-title">Flask app.py</text>
  <text x="642" y="248" class="box-note">graf-API og skrive-API</text>
  <rect x="790" y="195" width="195" height="76" rx="10" class="current"/>
  <text x="887" y="226" class="box-title">graph_store.py</text>
  <text x="887" y="248" class="box-note">validerer og lagrer</text>
  <rect x="1035" y="195" width="195" height="76" rx="10" class="current-data"/>
  <text x="1132" y="226" class="box-title">graphs/*.json</text>
  <text x="1132" y="248" class="box-note">arbeidskopier</text>
  <rect x="1260" y="195" width="175" height="76" rx="10" class="current-data"/>
  <text x="1347" y="226" class="box-title">graph_starters/</text>
  <text x="1347" y="248" class="box-note">reset-grunnlag</text>
  <path d="M250 233 H300 M495 233 H545 M740 233 H790 M985 233 H1035" class="line"/>
  <path d="M887 195 V180 H1347 V195" class="line dashed"/>

  <rect x="300" y="320" width="195" height="75" rx="10" class="current"/>
  <text x="397" y="351" class="box-title">classifier.py</text>
  <text x="397" y="373" class="box-note">OpenAI er valgfritt</text>
  <rect x="545" y="320" width="195" height="75" rx="10" class="current"/>
  <text x="642" y="351" class="box-title">build_demo.py</text>
  <text x="642" y="373" class="box-note">kopierer Autic-graf</text>
  <rect x="790" y="320" width="195" height="75" rx="10" class="current-data"/>
  <text x="887" y="351" class="box-title">demo/graph.json</text>
  <text x="887" y="373" class="box-note">statisk og lesbar</text>
  <rect x="1035" y="320" width="195" height="75" rx="10" class="current"/>
  <text x="1132" y="351" class="box-title">GitHub Pages</text>
  <text x="1132" y="373" class="box-note">bygger ved push</text>
  <path d="M642 271 V295 H397 V320" class="line"/>
  <path d="M1132 271 V295 H642 V320" class="line dashed"/>
  <path d="M740 357 H790 M985 357 H1035" class="line"/>

  <text x="48" y="490" class="section">Foreslått produksjonsflyt</text>
  <rect x="40" y="510" width="990" height="430" rx="18" fill="#f0faf7" stroke="#67b5a6" stroke-width="2"/>
  <rect x="1050" y="510" width="410" height="430" rx="18" fill="#fffaf0" stroke="#d6aa5c" stroke-width="2"/>
  <text x="65" y="542" class="zone">Intern sone · SQL-tilgang bare her</text>
  <text x="1075" y="542" class="zone">Publiseringssone · ingen SQL-tilgang</text>

  <rect x="70" y="590" width="195" height="88" rx="10" class="proposed"/>
  <text x="167" y="621" class="box-title">UniMicro V3</text>
  <text x="167" y="644" class="box-note">MSSQL klientbase</text>
  <text x="167" y="661" class="box-note">varedata er fasit</text>
  <rect x="310" y="590" width="195" height="88" rx="10" class="control"/>
  <text x="407" y="621" class="box-title">Avgrenset uttrekk</text>
  <text x="407" y="644" class="box-note">visning / godkjente felt</text>
  <text x="407" y="661" class="box-note">snever SELECT</text>
  <rect x="550" y="590" width="195" height="88" rx="10" class="proposed"/>
  <text x="647" y="621" class="box-title">Intern synk-jobb</text>
  <text x="647" y="644" class="box-note">periodisk uthenting</text>
  <text x="647" y="661" class="box-note">normaliser + flett</text>
  <rect x="790" y="590" width="195" height="88" rx="10" class="control"/>
  <text x="887" y="621" class="box-title">Publiseringsport</text>
  <text x="887" y="644" class="box-note">valider + avvikskontroll</text>
  <text x="887" y="661" class="box-note">feil beholder siste gode</text>
  <path d="M265 634 H310 M505 634 H550 M745 634 H790" class="future-line"/>

  <rect x="310" y="785" width="195" height="76" rx="10" class="control"/>
  <text x="407" y="815" class="box-title">Planlegger + identitet</text>
  <text x="407" y="838" class="box-note">egen intern tjenestekonto</text>
  <rect x="550" y="785" width="195" height="76" rx="10" class="proposed"/>
  <text x="647" y="815" class="box-title">Kuraterte koblinger</text>
  <text x="647" y="838" class="box-note">protokoll, bruksområde m.m.</text>
  <rect x="790" y="785" width="195" height="76" rx="10" class="control"/>
  <text x="887" y="815" class="box-title">Logg + varsling</text>
  <text x="887" y="838" class="box-note">ingen rå CRM-data i logg</text>
  <path d="M407 785 V722 H647 V678" class="future-line dashed"/>
  <path d="M647 785 V678" class="future-line"/>
  <path d="M887 678 V785" class="future-line dashed"/>

  <rect x="1080" y="590" width="155" height="88" rx="10" class="published"/>
  <text x="1157" y="621" class="box-title">Godkjent JSON</text>
  <text x="1157" y="644" class="box-note">kun offentlig utvalg</text>
  <text x="1157" y="661" class="box-note">versjonert artefakt</text>
  <rect x="1270" y="590" width="155" height="88" rx="10" class="published"/>
  <text x="1347" y="621" class="box-title">Statisk visning</text>
  <text x="1347" y="644" class="box-note">lesbar graf</text>
  <text x="1347" y="661" class="box-note">uten skrive-API</text>
  <rect x="1270" y="785" width="155" height="76" rx="10" class="published"/>
  <text x="1347" y="815" class="box-title">Nettleser</text>
  <text x="1347" y="838" class="box-note">ingen SQL-adgang</text>
  <path d="M985 634 H1080 M1235 634 H1270 M1347 678 V785" class="future-line"/>
  <text x="1002" y="607" class="annotation" text-anchor="middle">utgående</text>
  <text x="65" y="910" class="annotation">Eksisterende nettstedkobling til V3 må kartlegges før valg av faktisk uttrekk og publiseringsfilter.</text>
</svg>
